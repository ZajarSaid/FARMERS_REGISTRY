{% load static %}
<div class="sidebar-inner">
  <div class="sidebar-user">
    {% if user.image %}
      <img src="{{ user.image.url }}" alt="Profile" class="user-avatar">
    {% else %}
      <img src="{% static 'Profiles/avatar.svg' %}" alt="Profile" class="user-avatar">
    {% endif %}
    <div>
      <div class="sidebar-user-name">{{ user.username }}</div>
      <div class="sidebar-user-sub">{{ user.email }}</div>
    </div>
  </div>

  <nav class="sidebar-nav">
    <div class="sidebar-label">Core</div>
    <a href="{% url 'User:home-page' %}" class="sidebar-link">
      <i class="bi bi-speedometer2"></i>Dashboard
    </a>

    <div class="sidebar-label">Apps</div>
    <a href="{% url 'User:farmer-history' %}" class="sidebar-link">
      <i class="bi bi-clock-history"></i>History
    </a>
    <a href="{% url 'User:regional-prices' %}" class="sidebar-link">
      <i class="bi bi-currency-exchange"></i>Market Prices
    </a>
    <a href="{% url 'User:register-Farm' %}" class="sidebar-link">
      <i class="bi bi-pencil-square"></i>Register Farm
    </a>

    <div class="sidebar-label">Account</div>
    <a href="{% url 'User:farmer-account' %}" class="sidebar-link">
      <i class="bi bi-person-fill"></i>Profile
    </a>
    <a href="{% url 'User:change-password' %}" class="sidebar-link">
      <i class="bi bi-key-fill"></i>Change Password
    </a>
  </nav>

  <div class="sidebar-footer">
    <a href="{% url 'User:logout' %}" class="sidebar-link">
      <i class="bi bi-box-arrow-right"></i>Logout
    </a>
  </div>
</div>
