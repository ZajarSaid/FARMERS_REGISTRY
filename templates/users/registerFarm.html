{% extends 'users/FarmerPage.html'%}
{% load static %}

{% block header %}Register Farm {% endblock %}
{% block btn %}{% endblock %}
{% block title %}Register Farm {% endblock %}
{% block cumb %}Register Farm {% endblock %}
{% block content %}

<div class="account-card p-4">
    <h6 class="text-success fw-semibold mb-3"><i class="bi bi-plus-circle-fill me-2"></i>Register a New Farm</h6>

    <form action="{% url 'User:register-Farm' %}" method="post">
        {% csrf_token %}
        <input type="hidden" value="{{ farmer }}" name="farmer">

        <div class="row g-3">
            <div class="col-md-6">
                <label class="form-label" for="nameField">Farm Name</label>
                <input type="text" class="form-control" id="nameField" placeholder="Enter Farm name" name="farmname">
            </div>

            <div class="col-md-6">
                <label class="form-label" for="sizeField">Size</label>
                <input type="text" class="form-control" id="sizeField" placeholder="Enter size (e.g. 2 hectares)" name="size">
            </div>

            <div class="col-md-6">
                <label class="form-label" for="cropTypeSelect">Crop Type</label>
                <select name="crop_type" id="cropTypeSelect" class="form-select">
                    {% for crop_type in crop_types %}
                    <option value="{{ crop_type.id }}">{{ crop_type.name }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="col-md-6">
                <label class="form-label" for="regionSelect">Region</label>
                <select name="region" id="regionSelect" data-url="{% url 'User:load-districts' %}" class="form-select">
                    {% for region in regions %}
                    <option value="{{ region.id }}">{{ region.name }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="col-md-6">
                <label class="form-label" for="districtSelect">District</label>
                <select name="district" id="districtSelect" class="form-select">
                    {% for district in districts %}
                    <option value="{{ district.id }}">{{ district.name }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="col-12">
                <button type="submit" class="btn btn-brand"><i class="bi bi-check2-circle me-1"></i>Register Farm</button>
            </div>
        </div>
    </form>
</div>

{% endblock %}
