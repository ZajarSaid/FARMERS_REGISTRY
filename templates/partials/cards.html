<div class="row g-3 mb-4">
    <div class="col-6 col-lg-3">
        <a href="{% url 'Production:all-farmers' %}" class="text-decoration-none">
            <div class="stat-box">
                <div class="stat-icon"><i class="bi bi-people-fill"></i></div>
                <div class="stat-count">{{ farmers.count }}</div>
                <div class="stat-label">Farmers</div>
            </div>
        </a>
    </div>
    <div class="col-6 col-lg-3">
        <a href="{% url 'Production:all-farms' %}" class="text-decoration-none">
            <div class="stat-box">
                <div class="stat-icon"><i class="bi bi-tree-fill"></i></div>
                <div class="stat-count">{{ farms.count }}</div>
                <div class="stat-label">Farms</div>
            </div>
        </a>
    </div>
    <div class="col-6 col-lg-3">
        <a href="{% url 'Production:all-crops' %}" class="text-decoration-none">
            <div class="stat-box">
                <div class="stat-icon"><i class="bi bi-basket-fill"></i></div>
                <div class="stat-count {% if crops.count > 100 %}text-danger{% endif %}">{{ crops.count }}</div>
                <div class="stat-label">Crops</div>
            </div>
        </a>
    </div>
    <div class="col-6 col-lg-3">
        <a href="{% url 'Production:regional-prices' %}" class="text-decoration-none">
            <div class="stat-box">
                <div class="stat-icon"><i class="bi bi-geo-alt-fill"></i></div>
                <div class="stat-count">{{ regions.count }}</div>
                <div class="stat-label">Regions</div>
            </div>
        </a>
    </div>
</div>
