{% load static %}
<div class="sidebar-inner">
    <div class="sidebar-user">
        {% if user.image %}
        <img src="{{ user.image.url }}" alt="Profile" class="user-avatar">
        {% else %}
        <img src="{% static 'Profiles/avatar.svg' %}" alt="Profile" class="user-avatar">
        {% endif %}
        <div>
            <div class="sidebar-user-name">{{ user.username }}</div>
            <div class="sidebar-user-sub">{{ user.email }}</div>
        </div>
    </div>

    <nav class="sidebar-nav">
        <div class="sidebar-label">Core</div>
        <a href="{% url 'Production:dashboard' %}" class="sidebar-link">
            <i class="bi bi-speedometer2"></i><span>Dashboard</span>
        </a>

        <div class="sidebar-label">Management</div>
        <a href="{% url 'Production:all-farmers' %}" class="sidebar-link">
            <i class="bi bi-people-fill"></i><span>Farmers</span>
        </a>
        <a href="{% url 'Production:all-farms' %}" class="sidebar-link">
            <i class="bi bi-tree-fill"></i><span>Farms</span>
        </a>
        <a href="{% url 'Production:all-crops' %}" class="sidebar-link">
            <i class="bi bi-basket-fill"></i><span>Crops</span>
        </a>
        <a href="{% url 'Production:regional-prices' %}" class="sidebar-link">
            <i class="bi bi-currency-exchange"></i><span>Regional Prices</span>
        </a>
        <a href="{% url 'Production:add-regional-prices' %}" class="sidebar-link">
            <i class="bi bi-plus-circle-fill"></i><span>Add Price</span>
        </a>

        <div class="sidebar-label">Summary</div>
        <a href="{% url 'Production:farm-output-trends' %}" class="sidebar-link">
            <i class="bi bi-bar-chart-fill"></i><span>Production Trends</span>
        </a>
    </nav>

    <div class="sidebar-footer">
        <a href="{% url 'User:logout' %}" class="sidebar-link">
            <i class="bi bi-box-arrow-right"></i><span>Logout</span>
        </a>
    </div>
</div>
