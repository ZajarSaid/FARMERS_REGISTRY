{% if request.user.is_authenticated %}
<div class="modal fade" id="deleteModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content" style="border: none; border-radius: 18px; overflow: hidden;">
            <div class="modal-header border-0" style="background: #dc3545;">
                <h5 class="modal-title text-white"><i class="bi bi-trash-fill me-2"></i>Deletion</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body p-4">
                <p class="mb-0">Are you sure you want to delete <strong id="deleteName"></strong>? This action cannot be undone.</p>
            </div>
            <div class="modal-footer border-0 bg-light">
                <form method="post" id="deleteForm" action="">
                    {% csrf_token %}
                    <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-danger"><i class="bi bi-check-lg me-1"></i>Delete</button>
                </form>
            </div>
        </div>
    </div>
</div>
<script>
    document.addEventListener('DOMContentLoaded', function () {
        var modal = document.getElementById('deleteModal');
        if (modal) {
            modal.addEventListener('show.bs.modal', function (event) {
                var btn = event.relatedTarget;
                document.getElementById('deleteName').textContent = btn.getAttribute('data-name');
                document.getElementById('deleteForm').action = btn.getAttribute('data-url');
            });
        }
    });
</script>
{% endif %}
