<div class="row g-4">
  <div class="col-md-4">
    <div class="stat-box">
      <div class="stat-icon"><i class="bi bi-tree-fill"></i></div>
      <div class="stat-count">{{ farms.count }}</div>
      <div class="stat-label">My Farms</div>
    </div>
  </div>

  <div class="col-md-4">
    <div class="stat-box">
      <div class="stat-icon"><i class="bi bi-basket-fill"></i></div>
      <div class="stat-count">{{ crops }}</div>
      <div class="stat-label">My Crops</div>
    </div>
  </div>

  <div class="col-md-4">
    <div class="stat-box">
      <div class="stat-icon"><i class="bi bi-briefcase-fill"></i></div>
      <div class="stat-count">{{ output }}</div>
      <div class="stat-label">Total Output</div>
    </div>
  </div>
</div>
