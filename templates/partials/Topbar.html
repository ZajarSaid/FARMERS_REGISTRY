{% load static %}
<nav class="navbar account-topbar">
    <div class="container-fluid px-3">
        <div class="d-flex align-items-center gap-2">
            <button class="navbar-toggler navbar-toggler-soft d-lg-none" type="button" data-bs-toggle="offcanvas"
                data-bs-target="#demo" aria-controls="demo" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <a class="navbar-brand" href="{% url 'Production:dashboard' %}">
                <img src="{% static 'Photos/tz_gov_logo.png' %}" alt="Ministry of Agriculture" class="brand-logo">
                <span class="d-none d-sm-inline">Farmers Registry System</span>
            </a>
        </div>
        {% if user.is_authenticated %}
        <ul class="navbar-nav">
            <li class="nav-item dropdown auth-user-dropdown">
                <a class="user-chip dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown"
                    aria-expanded="false">
                    {% if user.image %}
                    <img src="{{ user.image.url }}" alt="Profile" class="user-avatar">
                    {% else %}
                    <img src="{% static 'Profiles/avatar.svg' %}" alt="Profile" class="user-avatar">
                    {% endif %}
                    <span class="d-none d-md-block text-start">
                        <span class="d-block user-name">{{ user.username }}</span>
                        <span class="d-block user-role">{% if user.is_superuser %}Administrator{% else %}Staff{% endif %}</span>
                    </span>
                </a>
                <ul class="dropdown-menu dropdown-menu-end">
                    <li><a class="dropdown-item" href="{% url 'Production:user-profile' request.user.username %}"><i class="bi bi-person-fill me-2"></i>Profile</a></li>
                    <li><a class="dropdown-item" href="{% url 'Production:user-profile' request.user.username %}#security"><i class="bi bi-key-fill me-2"></i>Change Password</a></li>
                    <li><hr class="dropdown-divider"></li>
                    <li><a class="dropdown-item text-danger" href="{% url 'User:logout' %}"><i class="bi bi-box-arrow-right me-2"></i>Logout</a></li>
                </ul>
            </li>
        </ul>
        {% endif %}
    </div>
</nav>
