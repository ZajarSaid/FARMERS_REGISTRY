{% if pending_verifications %}
<div class="modal fade" id="notificationModal" tabindex="-1" aria-hidden="true" data-bs-backdrop="static" data-bs-keyboard="false">
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content" style="border: none; border-radius: 18px; box-shadow: 0 20px 55px rgba(20, 90, 37, 0.28); overflow: hidden;">
            <div class="modal-header border-0" style="background: linear-gradient(135deg, #1e7e34, #145a25);">
                <h5 class="modal-title text-white fw-semibold">
                    <i class="bi bi-bell-fill me-2"></i>Farm Update Notifications
                    <span class="badge bg-warning text-dark ms-2">{{ pending_count }}</span>
                </h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body p-4">
                <div class="d-flex flex-column gap-2" style="max-height: 380px; overflow-y: auto;">
                    {% for n in pending_verifications %}
                    <div class="account-card p-3">
                        <div class="d-flex align-items-start gap-3">
                            <div class="stat-icon" style="width: 44px; height: 44px; min-width: 44px; font-size: 1.05rem;">
                                <i class="bi bi-tree-fill"></i>
                            </div>
                            <div class="flex-grow-1">
                                <div class="fw-semibold">{{ n.owner.username }} | {{ n.farm_name }}</div>
                                <div class="small text-muted">{{ n.verification_message }}</div>
                            </div>
                        </div>
                        <div class="d-flex gap-2 mt-3">
                            <form action="{% url 'User:accept-notification' n.id %}" method="post">
                                {% csrf_token %}
                                <button type="submit" class="btn btn-brand btn-sm"><i class="bi bi-check-lg me-1"></i>Accept</button>
                            </form>
                            <form action="{% url 'User:deny-notification' n.id %}" method="post">
                                {% csrf_token %}
                                <button type="submit" class="btn btn-outline-danger btn-sm"><i class="bi bi-x-lg me-1"></i>Reject</button>
                            </form>
                        </div>
                    </div>
                    {% endfor %}
                </div>
            </div>
            <div class="modal-footer border-0 bg-light">
                <button type="button" class="btn btn-light" data-bs-dismiss="modal"><i class="bi bi-clock me-1"></i>Review Later</button>
            </div>
        </div>
    </div>
</div>
<script>
    document.addEventListener('DOMContentLoaded', function () {
        var modalEl = document.getElementById('notificationModal');
        if (modalEl) {
            new bootstrap.Modal(modalEl).show();
        }
    });
</script>
{% endif %}
