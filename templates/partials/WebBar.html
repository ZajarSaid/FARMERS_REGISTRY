{% load static %}
<nav class="navbar navbar-expand-lg site-navbar">
  <div class="container">
    <a class="navbar-brand" href="{% url 'User:index' %}">
      <img src="{% static 'Photos/tz_gov_logo.png' %}" alt="Ministry of Agriculture" class="brand-logo">

    </a>
    <button class="navbar-toggler navbar-toggler-soft" type="button" data-bs-toggle="collapse"
            data-bs-target="#siteNav" aria-controls="siteNav" aria-expanded="false"

    <div class="collapse navbar-collapse" id="siteNav">

        <li class="nav-item">

        <li class="nav-item">

        <li class="nav-item">

        </li>
        <li class="nav-item">
          <a class="nav-link nav-link-soft" href="#contact">Contact</a>
