# Render Blueprint for FARMERS_REGISTRY
# Deploy via Render Dashboard: New + > Blueprint

databases:
  - name: farmers-registry-db
    plan: free
    databaseName: farmers_registry
    user: farmers_registry

services:
  - type: web
    name: farmers-registry
    runtime: python
    plan: free

    buildCommand: bash ./build.sh

    startCommand: python manage.py migrate --noinput && python manage.py create_data && gunicorn Farmers_registry.wsgi:application --bind 0.0.0.0:$PORT --workers 1 --access-logfile - --error-logfile -

    healthCheckPath: /

    envVars:
      - key: DEBUG
        value: "False"

      - key: SECRET_KEY
        generateValue: true

      - key: ALLOWED_HOSTS
        value: ".onrender.com"

      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"

      - key: DATABASE_URL
        fromDatabase:
          name: farmers-registry-db
          property: connectionString
